<script>
'use strict';const bikes=JSON.parse(document.querySelector('#bikes').textContent);const money=n=>new Intl.NumberFormat('cs-CZ').format(n)+' Kč';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const safe=u=>/^https:\/\//.test(u)?u:'#';const link=(u,t)=>`<a href="${esc(safe(u))}" target="_blank" rel="noopener noreferrer">${esc(t)}</a>`;let current=1;
function description(b){const os=b.details.find(d=>d.label==='Osazení');const spec=os?os.text:b.details.filter(d=>['Přehazovačka','Přesmykač','Kliky a převodníky','Brzdy a páky','Zapletená kola'].includes(d.label)).map(d=>d.text).join(' ');return `<div class="summary"><div><h2>Rám a identifikace</h2><p>${esc(b.frame)}</p></div><div><h2>Osazení</h2><p>${esc(spec||b.originality)}</p></div><div><h2>Původnost a úpravy</h2><p>${esc(b.originality)}</p></div><div><h2>Stav podle fotografií</h2><p>${esc(b.condition)}</p></div></div>`;}
function hero(b){return `<div class="headline"><div><div class="eyebrow">Kolo ${String(b.n).padStart(2,'0')} / 17</div><h1>${esc(b.title)}</h1><p class="age">${esc(b.age)}</p></div><div class="pricebox"><span class="sub">Startovací prodejní cena</span><strong class="price">${money(b.price)}</strong></div></div><div class="hero"><figure class="photo"><img src="${b.image}" alt="Kolo č. ${b.n}, celkový pohled z pravého boku" data-zoom="${b.n}"><figcaption>Úvodní fotografie z pravého boku. Evidence podle složky č. ${b.n}.</figcaption></figure>${description(b)}</div>`;}
function show(n){current=n;const b=bikes[n-1];document.title=`${b.title} | Kolo ${n}`;document.querySelector('#choose').value=n;document.querySelector('#prev').disabled=n===1;document.querySelector('#next').disabled=n===17;const detail=b.details.filter(d=>!['Rozhodnutí majitele','Fotografické podklady','Číslování'].includes(d.label));document.querySelector('#content').innerHTML=hero(b)+`<div class="linkrow"><a class="btn primary" target="_blank" rel="noopener noreferrer" href="${esc(b.folder)}">Všechny fotografie na Google Drivu</a><button class="btn" onclick="document.querySelector('#analysis').open=!document.querySelector('#analysis').open">Podrobné hodnocení</button></div><details class="details" id="analysis"><summary>Vypracované hodnocení a cenové srovnání</summary><p class="note">Identifikace a technický stav vycházejí z fotografií. Nejisté modely a roky zůstávají označené jako odhad.</p>${b.cz?`<div class="market"><div>Odhad pro ČR<strong>${money(b.cz[0])}–${money(b.cz[1])}</strong></div><div>Orientační odhad pro Německo<strong>${money(b.de[0])}–${money(b.de[1])}</strong></div></div>`:`<p class="note">Start 59 000 Kč je zkouška sběratelského trhu. Původní číselný odhad byl překonán po zjištění dvoupákového řazení. Konečná tržní hodnota není potvrzena.</p>`}<div class="detailgrid">${detail.map(d=>`<div><h3>${esc(d.label)}</h3><p>${esc(d.text)}</p><div class="confidence">${esc(d.confidence)}</div><div class="sources">${(d.source.match(/https:\/\/[^\s;]+/g)||[]).map((u,i)=>link(u,'Podklad '+(i+1))).join('')}</div></div>`).join('')}</div><section class="panel"><h2>Srovnávací inzerce</h2><p class="note">Odkazy a ceny převzaté z dosavadního hodnocení. Jde o nabídkové ceny nebo označené archivy. Dostupnost se může změnit.</p><div class="adlist">${b.ads.map(a=>`<article class="ad">${link(a.url,a.title)}<p class="amount">${a.price?esc(new Intl.NumberFormat('cs-CZ').format(Number(a.price))+' '+a.currency):'Cena nezveřejněna'}</p><p>${esc(a.note)}</p><span class="confidence">Záznam ${esc(a.date)}</span></article>`).join('')}</div></section></details><div class="bottomnav"><button class="btn" ${n===1?'disabled':''} onclick="navigate(${n-1})">Předchozí kolo</button><span class="note">${n} / 17</span><button class="btn" ${n===17?'disabled':''} onclick="navigate(${n+1})">Další kolo</button></div>`;document.querySelector('[data-zoom]').onclick=()=>{document.querySelector('#zoomImage').src=b.image;document.querySelector('#zoom').showModal();};window.scrollTo(0,0);}
function all(){current=0;document.title='Kola | fotografický katalog';document.querySelector('#choose').value='0';document.querySelector('#prev').disabled=true;document.querySelector('#next').disabled=false;document.querySelector('#content').innerHTML=`<div class="alltitle"><div class="eyebrow">Sbírka 17 kol</div><h1>Historická a silniční kola</h1><p class="age">Fotografie, popisy a startovací prodejní ceny stanovené majitelem.</p></div><div class="overviewgrid">${bikes.map(b=>`<button class="tile" onclick="navigate(${b.n})"><img loading="lazy" src="${b.image}" alt="Kolo č. ${b.n} z pravého boku"><div class="body"><span class="eyebrow">Kolo ${String(b.n).padStart(2,'0')}</span><h2>${esc(b.title)}</h2><strong>${money(b.price)}</strong></div></button>`).join('')}</div>`;window.scrollTo(0,0);}
function navigate(n){location.hash=n?'kolo-'+n:'prehled';}function route(){const m=location.hash.match(/^#kolo-(\d+)$/);if(location.hash==='#prehled')all();else show(m?Math.max(1,Math.min(17,Number(m[1]))):1);}
document.querySelector('#choose').innerHTML='<option value="0">Přehled</option>'+bikes.map(b=>`<option value="${b.n}">${b.n}. ${esc(b.title)}</option>`).join('');document.querySelector('#choose').onchange=e=>navigate(Number(e.target.value));document.querySelector('#overview').onclick=()=>navigate(0);document.querySelector('#prev').onclick=()=>navigate(Math.max(1,current-1));document.querySelector('#next').onclick=()=>navigate(Math.min(17,current+1));document.querySelector('#closeZoom').onclick=()=>document.querySelector('#zoom').close();document.querySelector('#zoom').onclick=e=>{if(e.target===e.currentTarget)e.currentTarget.close();};document.addEventListener('keydown',e=>{if(['SELECT','INPUT','TEXTAREA'].includes(e.target.tagName)||document.querySelector('#zoom').open)return;if(e.key==='ArrowRight'&&current<17)navigate(current+1);if(e.key==='ArrowLeft'&&current>1)navigate(current-1);});window.addEventListener('hashchange',route);window.addEventListener('beforeprint',()=>document.querySelector('#print').innerHTML=bikes.map(b=>`<section class="printslide">${hero(b)}<p class="printdrive">Fotografie na Drivu: ${esc(b.folder)}</p></section>`).join(''));route();
const SALES_KEY='kola-sales-v1';let sales={},storageAvailable=true;
function cleanSales(raw){const out={};if(!raw||typeof raw!=='object')return out;for(const b of bikes){const x=raw[b.n];if(!x||typeof x!=='object')continue;const discount=[0,10,20,30,40].includes(Number(x.discount))?Number(x.discount):0;const actual=typeof x.actual==='number'&&Number.isFinite(x.actual)&&x.actual>=0?Math.round(x.actual):null;out[b.n]={discount,sold:x.sold===true,actual};}return out;}
try{sales=cleanSales(JSON.parse(localStorage.getItem(SALES_KEY)||'{}'));}catch(e){storageAvailable=false;}
function saleFor(n){return sales[n]||{discount:0,sold:false,actual:null};}
function plannedPrice(b){return Math.round(b.price*(100-saleFor(b.n).discount)/100);}
function salePrice(b){const s=saleFor(b.n);return s.sold&&s.actual!==null?s.actual:plannedPrice(b);}
function totals(){let base=0,received=0,remaining=0,soldCount=0;for(const b of bikes){base+=b.price;if(saleFor(b.n).sold){received+=salePrice(b);soldCount++;}else remaining+=plannedPrice(b);}return {base,received,remaining,soldCount,total:received+remaining,difference:base-received-remaining};}
function saveSales(){try{localStorage.setItem(SALES_KEY,JSON.stringify(sales));storageAvailable=true;}catch(e){storageAvailable=false;}}
function updateSale(n,field,value){const b=bikes.find(b=>b.n===Number(n));if(!b)return;const s={...saleFor(b.n)};if(field==='discount'){const v=Number(value);if(![0,10,20,30,40].includes(v))return;s.discount=v;}else if(field==='sold'){s.sold=Boolean(value);if(s.sold&&s.actual===null)s.actual=Math.round(b.price*(100-s.discount)/100);}else if(field==='actual'){if(value===''){s.actual=null;}else{const v=Number(value);if(!Number.isFinite(v)||v<0)return;s.actual=Math.round(v);}}sales[b.n]=s;saveSales();refreshRow(b);refreshTotals();}
function refreshRow(b){const s=saleFor(b.n),row=document.querySelector('#sale-row-'+b.n);if(!row)return;row.classList.toggle('sold-row',s.sold);row.querySelector('.adjusted').textContent=money(plannedPrice(b));row.querySelector('.included').textContent=money(salePrice(b));const input=row.querySelector('input[type="number"]');input.disabled=!s.sold;input.value=s.sold&&s.actual!==null?s.actual:'';row.querySelector('.sale-state').textContent=s.sold?'Prodáno':'K prodeji';}
function refreshTotals(){const t=totals();for(const [id,value] of Object.entries({base:t.base,received:t.received,remaining:t.remaining,total:t.total,difference:t.difference})){const e=document.querySelector('#sum-'+id);if(e)e.textContent=money(value);}const count=document.querySelector('#sold-count');if(count)count.textContent=t.soldCount+' prodáno / '+(17-t.soldCount)+' zbývá';const notice=document.querySelector('#save-notice');if(notice)notice.textContent=storageAvailable?'Změny se ukládají v tomto prohlížeči na tomto zařízení. Ostatní návštěvníci je neuvidí.':'Prohlížeč neumožňuje ukládání. Po zavření stránky se změny mohou ztratit.';}
function discountOptions(n){const s=saleFor(n);return [0,10,20,30,40].map(v=>`<option value="${v}" ${v===s.discount?'selected':''}>${v} %</option>`).join('');}
function summaryPage(){current=-1;document.title='Souhrn a slevy | Kola';document.querySelector('#choose').value='-1';document.querySelector('#prev').disabled=true;document.querySelector('#next').disabled=true;const t=totals();document.querySelector('#content').innerHTML=`<div class="alltitle"><div class="eyebrow">Prodejní přehled / 17 kol</div><h1>Souhrn a slevy</h1><p class="age">Slevu nastavíš každému kolu samostatně. U prodaného kola se do součtu započítá skutečná prodejní cena.</p></div><div class="sales-baseline"><span>Celkem v původních prodejních cenách</span><strong id="sum-base">${money(t.base)}</strong><span id="sold-count">${t.soldCount} prodáno / ${17-t.soldCount} zbývá</span></div><div class="sales-tools"><button class="btn" id="resetDiscounts">Zrušit všechny slevy</button><button class="btn" id="downloadSales">Stáhnout přehled CSV</button></div><p class="note">Při označení „Prodáno“ se předvyplní cena po slevě. Uprav ji podle skutečného prodeje. Pokud ji necháš prázdnou, součet použije cenu po slevě.</p><div class="sales-table-wrap"><table class="sales-table"><thead><tr><th>Kolo</th><th>Startovací cena</th><th>Sleva</th><th>Cena po slevě</th><th>Prodáno</th><th>Skutečná cena</th><th>Částka do součtu</th></tr></thead><tbody>${bikes.map(b=>{const s=saleFor(b.n);return `<tr id="sale-row-${b.n}" class="${s.sold?'sold-row':''}"><th scope="row"><a href="#kolo-${b.n}"><span class="row-num">${String(b.n).padStart(2,'0')}</span>${esc(b.title)}</a><span class="sale-state">${s.sold?'Prodáno':'K prodeji'}</span></th><td>${money(b.price)}</td><td><select aria-label="Sleva pro kolo ${b.n}" onchange="updateSale(${b.n},'discount',this.value)">${discountOptions(b.n)}</select></td><td class="adjusted">${money(plannedPrice(b))}</td><td><input type="checkbox" aria-label="Kolo ${b.n} prodáno" ${s.sold?'checked':''} onchange="updateSale(${b.n},'sold',this.checked)"></td><td><input type="number" min="0" step="1" inputmode="numeric" aria-label="Skutečná prodejní cena kola ${b.n} v Kč" ${s.sold?'':'disabled'} value="${s.sold&&s.actual!==null?s.actual:''}" placeholder="Kč" onchange="updateSale(${b.n},'actual',this.value)"></td><td class="included">${money(salePrice(b))}</td></tr>`;}).join('')}</tbody></table></div><div class="sales-totalbar" aria-live="polite"><div><span>Za prodaná kola</span><strong id="sum-received">${money(t.received)}</strong></div><div><span>Očekávaný příjem za zbývající</span><strong id="sum-remaining">${money(t.remaining)}</strong></div><div class="grand"><span>Celkem získané + očekávané</span><strong id="sum-total">${money(t.total)}</strong></div></div><div class="sales-foot"><span>Rozdíl proti startovacím cenám: <strong id="sum-difference">${money(t.difference)}</strong></span><span id="save-notice"></span></div>`;document.querySelector('#resetDiscounts').onclick=()=>{for(const b of bikes)sales[b.n]={...saleFor(b.n),discount:0};saveSales();summaryPage();};document.querySelector('#downloadSales').onclick=downloadSales;refreshTotals();window.scrollTo(0,0);}
function downloadSales(){const lines=[['Kolo','Popis','Startovací cena CZK','Sleva %','Cena po slevě CZK','Prodáno','Skutečná cena CZK','Částka do součtu CZK'],...bikes.map(b=>{const s=saleFor(b.n);return [b.n,b.title,b.price,s.discount,plannedPrice(b),s.sold?'Ano':'Ne',s.sold&&s.actual!==null?s.actual:'',salePrice(b)];}),['Celkem','','','','','','',totals().total]];const csv='\uFEFF'+lines.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='Kola_prodejni_prehlad.csv';a.click();URL.revokeObjectURL(url);}
const originalShow=show;show=function(n){originalShow(n);const b=bikes[n-1],s=saleFor(n);const box=document.querySelector('.pricebox');box.insertAdjacentHTML('beforeend',s.sold?`<span class="sold-badge">Prodáno</span><span class="sale-card-price">Prodejní cena ${money(salePrice(b))}</span>`:s.discount?`<span class="sale-card-price">Po slevě ${s.discount} %: <strong>${money(plannedPrice(b))}</strong></span>`:'');document.querySelector('.linkrow').insertAdjacentHTML('beforeend','<a class="btn" href="#souhrn">Souhrn a slevy</a>');};
const originalAll=all;all=function(){originalAll();document.querySelectorAll('.tile').forEach((tile,i)=>{const b=bikes[i],s=saleFor(b.n);if(s.sold)tile.querySelector('.body').insertAdjacentHTML('beforeend','<span class="sold-badge">Prodáno</span>');else if(s.discount)tile.querySelector('.body').insertAdjacentHTML('beforeend',`<span class="sale-card-price">Po slevě: ${money(plannedPrice(b))}</span>`);});};
route=function(){if(location.hash==='#souhrn'){summaryPage();return;}const m=location.hash.match(/^#kolo-(\d+)$/);if(location.hash==='#prehled')all();else show(m?Math.max(1,Math.min(17,Number(m[1]))):1);};
window.addEventListener('hashchange',route);document.querySelector('#summaryNav').onclick=()=>{location.hash='souhrn';};document.querySelector('#choose').insertAdjacentHTML('beforeend','<option value="-1">Souhrn a slevy</option>');document.querySelector('#choose').onchange=e=>{const n=Number(e.target.value);if(n===-1)location.hash='souhrn';else navigate(n);};route();

</script></body></html>
